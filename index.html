<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>My English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── RESET & BASE ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0f14;
  --bg2:#151820;
  --bg3:#1c2030;
  --bg4:#242840;
  --surface:#1e2235;
  --surface2:#252a40;
  --border:#2a2f4a;
  --border2:#353b5a;
  --mint:#4eecc8;
  --mint2:#2dd4aa;
  --mint-dim:#1a3d35;
  --amber:#f5a623;
  --amber-dim:#3d2d0a;
  --rose:#ff6b6b;
  --rose-dim:#3d1515;
  --blue:#5b8dee;
  --blue-dim:#1a2550;
  --text:#f4f5fc;
  --text2:#b8c0e0;
  --text3:#8890b5;
  --ff-ko:'Pretendard',sans-serif;
  --ff-en:'DM Mono',monospace;
  --nav-h:68px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--ff-ko)}
button{font-family:var(--ff-ko);cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:var(--ff-ko);color:var(--text);background:var(--bg3);border:1px solid var(--border);border-radius:10px;outline:none;transition:border-color .2s}
input:focus,textarea:focus{border-color:var(--mint)}
textarea{resize:none}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ── APP SHELL ── */
#app{height:100%;display:flex;flex-direction:column;max-width:430px;margin:0 auto;position:relative}
#screens{flex:1;overflow:hidden;position:relative}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:0 0 calc(var(--nav-h) + var(--safe-b) + 16px)}
.screen.hidden{display:none}

/* ── BOTTOM NAV ── */
#nav{
  position:absolute;bottom:0;left:0;right:0;
  height:calc(var(--nav-h) + var(--safe-b));
  background:rgba(13,15,20,.92);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  display:flex;align-items:flex-start;
  padding-top:8px;
  z-index:100;
}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:12px;transition:.2s;color:var(--text3)}
.nav-btn.on{color:var(--mint)}
.nav-btn svg{width:22px;height:22px;stroke-width:1.8}
.nav-btn span{font-size:11px;font-weight:500}

/* ── PAGE HEADER ── */
.page-header{padding:20px 20px 0;display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.page-title{font-size:26px;font-weight:700;letter-spacing:-.5px}
.page-sub{font-size:14px;color:var(--text2);margin-top:2px}

/* ── CARDS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:20px}
.card+.card{margin-top:12px}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}

/* ── BUTTONS ── */
.btn-primary{width:100%;padding:15px;border-radius:14px;background:var(--mint);color:#0d0f14;font-size:15px;font-weight:700;transition:.15s;letter-spacing:.3px}
.btn-primary:active{transform:scale(.97);background:var(--mint2)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{padding:9px 16px;border-radius:10px;border:1px solid var(--border2);font-size:13px;color:var(--text2);transition:.15s}
.btn-ghost:hover{border-color:var(--mint);color:var(--mint)}
.btn-ghost:active{transform:scale(.97)}

/* ══════════════════════════════
   HOME SCREEN
══════════════════════════════ */
#screen-home{padding-top:0}
.home-hero{padding:30px 20px 20px;background:linear-gradient(160deg,var(--bg2) 0%,var(--bg) 100%);border-bottom:1px solid var(--border)}
.home-greeting{font-size:14px;color:var(--text2);margin-bottom:4px}
.home-title{font-size:28px;font-weight:700;line-height:1.2;letter-spacing:-.5px}
.home-title span{color:var(--mint)}

/* streak */
.streak-bar{display:flex;align-items:center;gap:10px;margin-top:16px;background:var(--bg3);border-radius:14px;padding:12px 16px;border:1px solid var(--border)}
.streak-fire{font-size:24px}
.streak-info{flex:1}
.streak-days{font-size:20px;font-weight:700;font-family:var(--ff-en)}
.streak-days span{font-size:14px;font-weight:400;color:var(--text2);margin-left:4px}
.streak-label{font-size:12px;color:var(--text3);margin-top:1px}
.streak-today{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px}

/* stats grid */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px;margin-top:12px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px}
.stat-val{font-size:24px;font-weight:700;font-family:var(--ff-en);color:var(--mint)}
.stat-label{font-size:12px;color:var(--text2);margin-top:2px}

/* quick actions */
.quick-title{font-size:14px;font-weight:600;color:var(--text2);padding:0 20px;margin-top:20px;margin-bottom:10px;text-transform:uppercase;letter-spacing:.8px}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px}
.quick-btn{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;text-align:left;transition:.15s;display:flex;flex-direction:column;gap:8px}
.quick-btn:active{transform:scale(.97);border-color:var(--mint)}
.quick-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.quick-btn-title{font-size:14px;font-weight:600}
.quick-btn-sub{font-size:12px;color:var(--text2)}

/* today section */
.today-section{padding:0 20px;margin-top:20px}
.today-card-item{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:8px;border-left:3px solid}
.today-card-ko{font-size:15px;font-weight:600;margin-bottom:4px}
.today-card-en{font-size:13px;font-family:var(--ff-en);color:var(--text2);line-height:1.6}

/* ══════════════════════════════
   STUDY SCREEN
══════════════════════════════ */
#screen-study{padding-top:0}
.study-header{padding:20px 20px 0;display:flex;align-items:center;justify-content:space-between}
.study-counter{font-size:14px;font-family:var(--ff-en);color:var(--text2)}
.study-mode-toggle{display:flex;background:var(--bg3);border-radius:10px;padding:3px;gap:3px}
.mode-btn{font-size:12px;font-weight:600;padding:5px 10px;border-radius:7px;color:var(--text3);transition:.2s}
.mode-btn.on{background:var(--surface2);color:var(--mint)}

/* progress */
.study-progress{padding:10px 20px 0}
.prog-bar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--mint),var(--blue));transition:width .4s cubic-bezier(.4,0,.2,1)}

/* cat filter */
.cat-scroll{display:flex;gap:8px;padding:12px 20px;overflow-x:auto;scrollbar-width:none}
.cat-scroll::-webkit-scrollbar{display:none}
.cat-chip{flex-shrink:0;font-size:13px;font-weight:600;padding:6px 14px;border-radius:20px;border:1px solid var(--border2);color:var(--text2);transition:.2s}
.cat-chip.on{border-color:transparent;color:#0d0f14}

/* FLIP CARD */
.flip-wrap{padding:0 20px;perspective:1200px;margin-bottom:16px}
.flip-card{width:100%;min-height:220px;position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,0,.2,1);cursor:pointer}
.flip-card.flipped{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;padding:28px 24px}
.flip-front{background:linear-gradient(135deg,var(--surface) 0%,var(--bg3) 100%);border:1px solid var(--border2)}
.flip-back{background:linear-gradient(135deg,var(--mint-dim) 0%,var(--bg3) 100%);border:1px solid var(--mint);transform:rotateY(180deg)}
.flip-hint{font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;margin-bottom:auto}
.flip-front .flip-hint{color:var(--text3)}
.flip-back .flip-hint{color:var(--mint)}
.flip-ko{font-size:22px;font-weight:700;line-height:1.45;color:var(--text);margin:auto 0;letter-spacing:-.3px}
.flip-en{font-size:16px;font-family:var(--ff-en);line-height:1.7;color:var(--text);margin:auto 0}
.flip-en .alt{display:block;font-size:14px;color:var(--text2);margin-top:6px}
.flip-cat{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;margin-top:auto;align-self:flex-start}

/* answer btns */
.answer-btns{display:flex;gap:10px;padding:0 20px;margin-bottom:12px}
.ans-btn{flex:1;padding:14px;border-radius:14px;font-size:14px;font-weight:700;border:1px solid;transition:.15s;display:flex;align-items:center;justify-content:center;gap:6px}
.ans-btn:active{transform:scale(.96)}
.ans-know{background:var(--mint-dim);border-color:var(--mint);color:var(--mint)}
.ans-dunno{background:var(--rose-dim);border-color:var(--rose);color:var(--rose)}

/* nav arrows */
.nav-arrows{display:flex;gap:10px;padding:0 20px}
.arrow-btn{flex:1;padding:13px;border-radius:14px;border:1px solid var(--border2);color:var(--text2);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.arrow-btn:active{border-color:var(--mint);color:var(--mint)}

/* speech btn */
.speech-row{display:flex;justify-content:center;margin-top:12px}
.speech-btn{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);padding:8px 16px;border-radius:10px;border:1px solid var(--border);transition:.2s}
.speech-btn.listening{color:var(--mint);border-color:var(--mint);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.speech-result{text-align:center;font-size:13px;margin-top:10px;padding:0 20px;min-height:20px}
.speech-result.correct{color:var(--mint)}
.speech-result.wrong{color:var(--rose)}

/* ══════════════════════════════
   QUIZ SCREEN
══════════════════════════════ */
#screen-quiz{padding-top:0}
.quiz-header{padding:20px 20px 16px}
.quiz-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.quiz-score-bar{display:flex;gap:6px;align-items:center}
.quiz-score{font-size:14px;font-family:var(--ff-en);color:var(--text2)}
.quiz-prog{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.quiz-fill{height:100%;background:var(--mint);transition:width .3s}

.quiz-card{margin:0 20px;background:var(--surface);border:1px solid var(--border2);border-radius:22px;padding:28px 24px;min-height:140px;display:flex;flex-direction:column;justify-content:center;margin-bottom:16px}
.quiz-direction{font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);margin-bottom:12px}
.quiz-question{font-size:20px;font-weight:700;line-height:1.45;letter-spacing:-.3px}
.quiz-question.en{font-family:var(--ff-en);font-size:17px}

.quiz-choices{padding:0 20px;display:flex;flex-direction:column;gap:10px}
.choice-btn{padding:16px 20px;border-radius:14px;border:1px solid var(--border2);background:var(--surface);text-align:left;font-size:14px;font-weight:500;line-height:1.45;transition:.2s;color:var(--text)}
.choice-btn:active{border-color:var(--mint)}
.choice-btn.correct{background:var(--mint-dim);border-color:var(--mint);color:var(--mint)}
.choice-btn.wrong{background:var(--rose-dim);border-color:var(--rose);color:var(--rose)}
.choice-btn.disabled{cursor:default}

.quiz-feedback{text-align:center;padding:12px 20px;font-size:14px;font-weight:600;min-height:44px}
.quiz-next{padding:0 20px;margin-top:4px}

.quiz-result{padding:40px 20px;text-align:center;display:none}
.result-emoji{font-size:64px;margin-bottom:16px}
.result-score{font-size:48px;font-weight:800;font-family:var(--ff-en);color:var(--mint)}
.result-label{font-size:16px;color:var(--text2);margin-top:4px;margin-bottom:32px}
.result-breakdown{display:flex;gap:12px;justify-content:center;margin-bottom:32px}
.result-item{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 20px;text-align:center}
.result-item-val{font-size:22px;font-weight:700;font-family:var(--ff-en)}
.result-item-label{font-size:12px;color:var(--text2);margin-top:2px}

/* ══════════════════════════════
   CHAT SCREEN (AI 대화)
══════════════════════════════ */
#screen-chat{padding-bottom:0;display:flex;flex-direction:column}
.chat-header{padding:20px 20px 12px;flex-shrink:0}
.chat-subtitle{font-size:14px;color:var(--text2);margin-top:4px}
.chat-scenario-scroll{display:flex;gap:8px;padding:0 20px 12px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.chat-scenario-scroll::-webkit-scrollbar{display:none}
.scenario-chip{flex-shrink:0;font-size:12px;font-weight:600;padding:7px 14px;border-radius:20px;border:1px solid var(--border2);color:var(--text2);transition:.2s}
.scenario-chip.on{background:var(--blue-dim);border-color:var(--blue);color:var(--blue)}

.chat-messages{flex:1;overflow-y:auto;padding:0 16px;margin-bottom:8px}
.msg{margin-bottom:12px;display:flex;flex-direction:column}
.msg.user{align-items:flex-end}
.msg.ai{align-items:flex-start}
.msg-bubble{max-width:82%;padding:12px 15px;border-radius:18px;font-size:14px;line-height:1.55}
.msg.user .msg-bubble{background:var(--mint);color:#0d0f14;font-weight:500;border-bottom-right-radius:4px}
.msg.ai .msg-bubble{background:var(--surface2);border:1px solid var(--border2);border-bottom-left-radius:4px}
.msg-en{font-family:var(--ff-en);font-size:13px;color:var(--text2);margin-top:4px;padding:0 4px}
.msg-correction{font-size:12px;color:var(--amber);margin-top:6px;padding:8px 12px;background:var(--amber-dim);border-radius:10px;border-left:2px solid var(--amber)}
.msg-time{font-size:10px;color:var(--text3);margin-top:4px;padding:0 4px}
.typing-bubble{display:flex;gap:4px;padding:14px 16px}
.typing-dot{width:6px;height:6px;border-radius:50%;background:var(--text3);animation:typing .8s ease infinite}
.typing-dot:nth-child(2){animation-delay:.15s}
.typing-dot:nth-child(3){animation-delay:.3s}
@keyframes typing{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

.chat-input-wrap{flex-shrink:0;padding:8px 16px;padding-bottom:calc(8px + var(--nav-h) + var(--safe-b));background:rgba(13,15,20,.9);backdrop-filter:blur(20px);border-top:1px solid var(--border)}
.chat-input-row{display:flex;gap:8px;align-items:flex-end}
.chat-input-row textarea{flex:1;padding:11px 14px;border-radius:14px;font-size:14px;line-height:1.5;max-height:120px;min-height:44px}
.chat-send{width:44px;height:44px;border-radius:12px;background:var(--mint);color:#0d0f14;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
.chat-send:active{transform:scale(.93)}
.chat-hint{font-size:12px;color:var(--text3);text-align:center;margin-bottom:6px}

/* ══════════════════════════════
   ADD SCREEN
══════════════════════════════ */
#screen-add{padding-top:0}
.add-form{padding:0 20px}
.field{margin-bottom:16px}
.field-label{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:8px;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.6px}
.field textarea,.field input[type=text]{width:100%;padding:13px 15px;border-radius:12px;font-size:15px;line-height:1.5}
.field textarea{min-height:80px}

.dup-alert{background:var(--amber-dim);border:1px solid var(--amber);border-radius:12px;padding:12px 14px;margin-bottom:16px;display:none}
.dup-alert.show{display:block}
.dup-alert-title{font-size:12px;font-weight:700;color:var(--amber);margin-bottom:6px}
.dup-item{font-size:13px;color:var(--text2);padding:2px 0}

.cat-preview-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 12px;border-radius:20px;margin-top:6px}
.ai-classify-status{font-size:13px;color:var(--text2);margin-top:8px;display:flex;align-items:center;gap:6px;min-height:20px}
.spinner{width:14px;height:14px;border:2px solid var(--border2);border-top-color:var(--mint);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══════════════════════════════
   LIST SCREEN
══════════════════════════════ */
#screen-list{padding-top:0}
.list-search-wrap{position:relative;padding:0 20px;margin-bottom:12px}
.list-search-wrap input{width:100%;padding:12px 15px 12px 40px;border-radius:12px;font-size:14px}
.list-search-icon{position:absolute;left:33px;top:50%;transform:translateY(-50%);color:var(--text3)}
.list-count{font-size:13px;color:var(--text3);padding:0 20px;margin-bottom:12px}

.cat-group{margin-bottom:20px}
.cat-group-head{display:flex;align-items:center;gap:8px;padding:0 20px;margin-bottom:10px}
.cat-group-badge{font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px}
.cat-group-count{font-size:12px;color:var(--text3)}
.list-item{display:flex;align-items:flex-start;gap:10px;padding:12px 20px;transition:.15s}
.list-item:active{background:var(--bg2)}
.list-item-left{flex:1;min-width:0}
.list-ko{font-size:14px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-en{font-size:12px;font-family:var(--ff-en);color:var(--text2);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-del{color:var(--text3);padding:4px;opacity:.5;flex-shrink:0;transition:.2s}
.list-del:active{opacity:1;color:var(--rose)}

/* ══════════════════════════════
   TOAST
══════════════════════════════ */
#toast{position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:10px 18px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ══════════════════════════════
   MODAL
══════════════════════════════ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:.3s}
.modal-overlay.show{opacity:1;pointer-events:all}
.modal-sheet{background:var(--bg2);border-radius:24px 24px 0 0;padding:24px 20px;width:100%;transform:translateY(100%);transition:.35s cubic-bezier(.4,0,.2,1)}
.modal-overlay.show .modal-sheet{transform:translateY(0)}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 20px}
.modal-title{font-size:18px;font-weight:700;margin-bottom:16px}

/* ══════════════════════════════
   ANIMATIONS
══════════════════════════════ */
.fade-in{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@keyframes cardPop{0%{transform:scale(.95)}50%{transform:scale(1.02)}100%{transform:scale(1)}}
.card-pop{animation:cardPop .3s ease}
</style>
</head>
<body>
<div id="app">
  <div id="screens">

    <!-- ══ HOME ══ -->
    <div class="screen" id="screen-home">
      <div class="home-hero">
        <div class="home-greeting" id="home-greeting">안녕하세요 👋</div>
        <div class="home-title">오늘도 <span>영어</span>로<br>말해볼까요?</div>
        <div class="streak-bar" id="streak-bar">
          <div class="streak-fire" id="streak-fire">🔥</div>
          <div class="streak-info">
            <div class="streak-days"><span id="streak-num">0</span><span>일 연속</span></div>
            <div class="streak-label" id="streak-label">오늘 학습을 시작해보세요</div>
          </div>
          <div class="streak-today" id="streak-today-badge"></div>
        </div>
      </div>
      <div class="stats-grid">

const S={

  get mastered(){return JSON.parse(ls('mastered')||'{}')},
  get weakSet(){return JSON.parse(ls('weakSet')||'[]')},
};
function ls(k,v){if(v!==undefined)localStorage.setItem(k,typeof v==='object'?JSON.stringify(v):v);else return localStorage.getItem(k);}
function saveStreak(){
  const today=new Date().toDateString();
  const last=S.lastDate;
  const yesterday=new Date(Date.now()-86400000).toDateString();
  if(last===today)return;
  if(last===yesterday){ls('streak',S.streak+1);}
  else if(last!==today){ls('streak',1);}

// Speech Recognition
let recognition=null, speechActive=false;
function toggleSpeech(){
  if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){
    showToast('이 브라우저에서는 음성 인식이 지원되지 않아요');return;
  }
  if(speechActive){recognition&&recognition.stop();return;}
  const d=studyCards[studyIdx];
  const target=d.en[0].toLowerCase().replace(/[^a-z\s]/g,'');
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR();
  recognition.lang='en-US';
  recognition.onresult=e=>{
    const said=e.results[0][0].transcript.toLowerCase().replace(/[^a-z\s]/g,'').trim();
    const ok=calcSpeechMatch(said,target);
    const el=document.getElementById('speech-result');
    el.textContent=ok?`✓ "${e.results[0][0].transcript}"`:`✗ "${e.results[0][0].transcript}"`;
    el.className='speech-result '+(ok?'correct':'wrong');
  };
  recognition.onend=()=>{speechActive=false;document.getElementById('speech-btn').classList.remove('listening');document.getElementById('speech-btn-label').textContent='발음 연습';};
  recognition.onstart=()=>{speechActive=true;document.getElementById('speech-btn').classList.add('listening');document.getElementById('speech-btn-label').textContent='듣는 중...';};
  recognition.start();
}
function calcSpeechMatch(said,target){
  const ws=new Set(said.split(' '));const wt=new Set(target.split(' '));
  let c=0;wt.forEach(w=>{if(ws.has(w))c++;});
  return c/wt.size>=0.6;
}

function renderQuizQ(){
  if(quizIdx>=quizCards.length){showQuizResult();return;}
  quizAnswered=false;
  quizMode=Math.random()>.5?'ko-en':'en-ko';
  const d=quizCards[quizIdx];

  document.getElementById('quiz-prog-fill').style.width=pct+'%';
  document.getElementById('quiz-score-label').textContent=`${quizCorrect} / ${quizIdx}`;
  document.getElementById('quiz-next-btn').style.display='none';
  document.getElementById('quiz-feedback').textContent='';

  if(quizMode==='ko-en'){
    document.getElementById('quiz-direction').textContent='한국어 → 영어';
    document.getElementById('quiz-question').textContent=d.ko;
    document.getElementById('quiz-question').className='quiz-question';
  } else {
    document.getElementById('quiz-direction').textContent='영어 → 한국어';
    document.getElementById('quiz-question').textContent=d.en[0];
    document.getElementById('quiz-question').className='quiz-question en';
  }

  // choices
  const others=cards.filter(c=>c.ko!==d.ko).sort(()=>Math.random()-.5).slice(0,3);
  const choices=[d,...others].sort(()=>Math.random()-.5);
  document.getElementById('quiz-choices').innerHTML=choices.map(c=>{
    const txt=quizMode==='ko-en'?c.en[0]:c.ko;
    return `<button class="choice-btn" onclick="checkAnswer(this,'${c.ko}','${d.ko}')">${txt}</button>`;
  }).join('');
}

function checkAnswer(btn, chosen, correct){
  if(quizAnswered)return;
  quizAnswered=true;
  const isCorrect=chosen===correct;
  btn.classList.add(isCorrect?'correct':'wrong');
  if(!isCorrect){
    document.querySelectorAll('.choice-btn').forEach(b=>{
      if(b.onclick&&b===btn)return;
      const txt=b.textContent;
      const target=cards.find(c=>(quizMode==='ko-en'?c.en[0]:c.ko)===txt);
      if(target&&target.ko===correct)b.classList.add('correct');
    });
  }
  document.querySelectorAll('.choice-btn').forEach(b=>b.classList.add('disabled'));
  if(isCorrect){quizCorrect++;document.getElementById('quiz-feedback').innerHTML='<span style="color:var(--mint)">✓ 정답!</span>';}
  else{
    quizWrong++;
    const d=quizCards[quizIdx];
    quizWrongCards.push(d.ko);
    document.getElementById('quiz-feedback').innerHTML=`<span style="color:var(--rose)">✗ 오답</span>`;
    let w=S.weakSet;if(!w.includes(d.ko))w.push(d.ko);ls('weakSet',w);
  }
  quizIdx++;
  document.getElementById('quiz-next-btn').style.display='block';
}

function similarity(a,b){
  const n=s=>s.replace(/[^가-힣a-z0-9\s]/gi,'').toLowerCase();
  const wa=new Set(n(a).split(/\s+/).filter(Boolean));
  const wb=new Set(n(b).split(/\s+/).filter(Boolean));
  let c=0;wa.forEach(w=>{if(wb.has(w))c++;});
  return new Set([...wa,...wb]).size===0?0:c/new Set([...wa,...wb]).size;
}

function checkDup(){
  const val=document.getElementById('inp-ko').value.trim();
  const box=document.getElementById('dup-alert');
  if(val.length<4){box.classList.remove('show');return;}
  const hits=cards.filter(c=>similarity(c.ko,val)>=0.45&&c.ko!==val);
  if(hits.length){
    document.getElementById('dup-list').innerHTML=hits.slice(0,3).map(c=>`<div class="dup-item">• ${c.ko}</div>`).join('');
    box.classList.add('show');
  }else box.classList.remove('show');
}

async function classifyCategory(ko){
  const status=document.getElementById('ai-classify-status');
  status.innerHTML=`<div class="spinner"></div> 카테고리 분류 중...`;
  const existing=[...new Set(cards.map(c=>c.cat))];
  try{
    const res=await fetch("/.netlify/functions/gemini",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({max_tokens:20,messages:[{role:"user",content:`다음 한국어 문장에 맞는 카테고리를 골라줘.\n현재 카테고리: ${existing.join(', ')}\n문장: "${ko}"\n규칙: 맞는 카테고리가 있으면 그 이름, 없으면 새 이름(한국어 2-4글자).\n카테고리명만 답해.`}]})
    });
    const data=await res.json();
    const cat=(data.content?.[0]?.text||'').trim().replace(/["""]/g,'');
    if(!cat){status.innerHTML='';return;}
    pendingCat=cat;
    const isNew=!existing.includes(cat);
    renderCatPreview(cat,isNew);
    status.innerHTML='';
  }catch(e){status.innerHTML='분류 실패. 다시 시도해주세요.';}
}
}

        <div class="list-item-left">
          <div class="list-ko">${m?'⭐ ':''}${c.ko}</div>
          <div class="list-en">${c.en[0]}</div>
        </div>
        <button class="list-del" onclick="delCard(${ci})">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
        </button>
      </div>`;
    }).join('');
    return `<div class="cat-group">
      <div class="cat-group-head">
        <span class="cat-group-badge" style="background:${col[1]};color:${col[0]}">${cat}</span>
        <span class="cat-group-count">${list.length}개</span>
      </div>
      ${rows}
    </div>`;
  }).join('');
}

function delCard(i){
  if(!confirm(`"${cards[i].ko}" 삭제할까요?`))return;
  cards.splice(i,1);
  renderList();
  showToast('삭제됐어요');
}

// ══════════════════════════════
//  INIT
// ══════════════════════════════
saveStreak();
renderHome();
renderStudyCats();
</script>
</body>
</html>
